<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filterlab: digital filter design</title>
<style>:root {
  color-scheme: light;
  --bg: #e8ecf0; --panel: #fcfcfb; --panel-2: #f3f5f7; --ink: #14202c; --ink-2: #4d5b69; --ink-3: #66737f;
  --line: #d4dbe2; --grid: #e6eaee; --accent: #1c4f9c; --accent-ink: #ffffff; --accent-soft: #e4edf9;
  --s1: #2a78d6; --s2: #eb6834; --good: #0b7a3b; --bad: #c23a39; --shade: rgba(227, 73, 72, .055); --shade-line: rgba(227, 73, 72, .55);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1215; --panel: #1a1d20; --panel-2: #212529; --ink: #eceef0; --ink-2: #b3bcc5; --ink-3: #8f9aa5;
  --line: #2f353b; --grid: #262b30; --accent: #7db0f0; --accent-ink: #0d1722; --accent-soft: #1f2d40;
  --s1: #3987e5; --s2: #d95926; --good: #3fbf72; --bad: #ee7373; --shade: rgba(238, 115, 115, .09); --shade-line: rgba(238, 115, 115, .6);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { font-size: 24px; }
.brand span { color: var(--ink-2); }
.top-actions { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; padding: 0 24px 32px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.controls { padding: 6px 16px 16px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.controls section { padding: 12px 0; border-bottom: 1px solid var(--line); }
.controls section:last-child { border-bottom: 0; }
.controls h3 { font-size: 15px; margin-bottom: 10px; }
.method { display: grid; gap: 6px; }
.method label { display: grid; grid-template-columns: 18px 1fr; gap: 0 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--panel); }
.method label:hover { background: var(--panel-2); }
.method input { grid-row: 1 / span 2; margin-top: 3px; accent-color: var(--accent); }
.method b { font-weight: 600; }
.method small { color: var(--ink-3); font-size: 12px; }
.method label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 7px 4px; cursor: pointer; border-right: 1px solid var(--line); display: grid; justify-items: center; gap: 3px; font-size: 12px; color: var(--ink-2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg svg { width: 34px; height: 16px; }
.field { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 8px; margin-top: 8px; }
.field label { color: var(--ink-2); }
.field input, .field select, .row select { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 8px; text-align: right; font-variant-numeric: tabular-nums; }
.field select { text-align: left; }
.field input:invalid { border-color: var(--bad); }
.unit { color: var(--ink-3); font-size: 12px; }
.hint { color: var(--ink-3); font-size: 12px; margin: 8px 0 0; }
.hidden { display: none !important; }

.stage { min-width: 0; display: grid; gap: 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 16px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.col { display: grid; gap: 14px; min-width: 0; }
.card { padding: 14px 16px 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.card-head h2 { font-size: 17px; }
.card-head .tools { display: flex; gap: 6px; align-items: center; color: var(--ink-3); font-size: 12px; }
.tools .seg { font-size: 12px; }
.tools .seg button { padding: 3px 10px; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 2px 0 4px; color: var(--ink-2); font-size: 12px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }

.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
.chart .axis-title { fill: var(--ink-2); font-size: 12px; }
.chart .grid line { stroke: var(--grid); }
.chart .frame { stroke: var(--line); fill: none; }
.chart .trace { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .handle { cursor: ew-resize; outline: none; }
.chart .handle:focus-visible .tab { stroke: var(--accent); stroke-width: 3; fill: var(--accent); }
.chart .handle:hover .tab, .chart .handle.active .tab { fill: var(--accent); }
.chart .edge { stroke: var(--ink-3); stroke-dasharray: 4 4; }
.chart .tab { fill: var(--ink-2); }
.chart .tabtxt { fill: var(--panel); font-size: 10px; font-weight: 600; }
.chart .shade { fill: var(--shade); stroke: none; }
.chart .shade-edge { stroke: var(--shade-line); stroke-width: 1.5; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); white-space: nowrap; z-index: 3; font-variant-numeric: tabular-nums; }
.tip b { font-weight: 600; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
details.data { margin-top: 6px; color: var(--ink-2); font-size: 12px; }
details.data summary { cursor: pointer; }
details.data table { margin-top: 6px; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
table.t th, table.t td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--line); }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { color: var(--ink-3); font-weight: 500; }
.scroll { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }

.score { display: grid; gap: 10px; }
.score .row { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; align-items: baseline; }
.score .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
.score .ic.ok { background: var(--good); } .score .ic.no { background: var(--bad); }
.score .lab { color: var(--ink-2); }
.score .val { font-family: var(--serif); font-size: 20px; }
.score .sub { grid-column: 2 / span 2; color: var(--ink-3); font-size: 12px; margin-top: -4px; }
.banner { border: 1px solid var(--bad); background: var(--shade); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.banner.info { border-color: var(--line); background: var(--panel-2); }

.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.slider input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.slider .big { font-family: var(--serif); font-size: 20px; }
.qctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; align-items: start; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; z-index: 10; }

@media (max-width: 1180px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); padding: 0 12px 24px; } .controls { position: static; max-height: none; } .top { padding: 12px; } .brand span { display: none; } }
@media (prefers-reduced-motion: no-preference) {
  .trace.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .9s cubic-bezier(.3, .6, .2, 1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
}

.check { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 12px; min-height: 44px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.check .unit { flex-basis: 100%; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Filterlab</h1><span id="subtitle">Digital filter design</span></div>
  <div class="top-actions"><button class="btn" id="copyPy" title="Copy the Python call that reproduces this design">Copy Python</button><button class="btn" id="theme">Dark theme</button></div>
</header>
<main class="app">
  <aside class="panel controls" id="controls" aria-label="Filter design controls"></aside>
  <section class="stage">
    <div class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-tab="response" aria-selected="true">Response</button>
      <button role="tab" data-tab="time" aria-selected="false">Time and coefficients</button>
      <button role="tab" data-tab="quant" aria-selected="false">Quantization</button>
    </div>
    <div id="view" role="tabpanel" aria-live="polite"></div>
  </section>
</main>
<script>/* filterlab DSP engine - port of the tested Python reference (dsp/*.py). No dependencies. */
(function (root) {
'use strict';
const PI = Math.PI;

/* ---------------- complex helpers ---------------- */
const cx = (re, im = 0) => ({ re, im });
const cadd = (a, b) => cx(a.re + b.re, a.im + b.im);
const csub = (a, b) => cx(a.re - b.re, a.im - b.im);
const cmul = (a, b) => cx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
const cdiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return cx((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
const cscale = (a, s) => cx(a.re * s, a.im * s);
const cconj = a => cx(a.re, -a.im);
const cabs = a => Math.hypot(a.re, a.im);
const csqrt = a => { const r = cabs(a); const re = Math.sqrt((r + a.re) / 2); const im = Math.sqrt(Math.max((r - a.re) / 2, 0)); return cx(re, a.im < 0 ? -im : im); };
const cexp = a => { const e = Math.exp(a.re); return cx(e * Math.cos(a.im), e * Math.sin(a.im)); };
const csinh = a => cx(Math.sinh(a.re) * Math.cos(a.im), Math.cosh(a.re) * Math.sin(a.im));
const cprod = arr => arr.reduce((p, x) => cmul(p, x), cx(1, 0));

/* ---------------- FIR: windows ---------------- */
function bessI0(x) { let s = 1, t = 1; const q = x * x / 4; for (let k = 1; k < 60; k++) { t *= q / (k * k); s += t; if (t < 1e-18 * s) break; } return s; }

function windowFn(name, N, beta = 8.6) {
  const w = new Float64Array(N); const m = N - 1;
  if (N === 1) { w[0] = 1; return w; }
  for (let n = 0; n < N; n++) {
    switch (name) {
      case 'rect': w[n] = 1; break;
      case 'hann': w[n] = 0.5 - 0.5 * Math.cos(2 * PI * n / m); break;
      case 'hamming': w[n] = 0.54 - 0.46 * Math.cos(2 * PI * n / m); break;
      case 'blackman': w[n] = 0.42 - 0.5 * Math.cos(2 * PI * n / m) + 0.08 * Math.cos(4 * PI * n / m); break;
      case 'kaiser': { const r = 2 * n / m - 1; w[n] = bessI0(beta * Math.sqrt(Math.max(1 - r * r, 0))) / bessI0(beta); break; }
      default: throw new Error('unknown window ' + name);
    }
  }
  return w;
}

function kaiserParams(attenDb, transHz, fs) {
  const A = attenDb;
  const beta = A > 50 ? 0.1102 * (A - 8.7) : (A >= 21 ? 0.5842 * Math.pow(A - 21, 0.4) + 0.07886 * (A - 21) : 0);
  const dw = 2 * PI * transHz / fs;
  let N = Math.ceil((A - 7.95) / (2.285 * dw) + 1);
  return { numtaps: N | 1, beta };
}

const sinc = x => x === 0 ? 1 : Math.sin(PI * x) / (PI * x);

function firWindow(numtaps, edges, kind, win, fs, beta = 8.6) {
  if ((kind === 'highpass' || kind === 'bandstop') && numtaps % 2 === 0) numtaps += 1;
  const M = (numtaps - 1) / 2; const w = edges.map(e => 2 * PI * e / fs);
  const lp = (wc, k) => (wc / PI) * sinc(wc * k / PI);
  const win_ = windowFn(win, numtaps, beta); const h = new Float64Array(numtaps);
  for (let n = 0; n < numtaps; n++) {
    const k = n - M; const d = (numtaps % 2 && n === M) ? 1 : 0; let v;
    if (kind === 'lowpass') v = lp(w[0], k);
    else if (kind === 'highpass') v = d - lp(w[0], k);
    else if (kind === 'bandpass') v = lp(w[1], k) - lp(w[0], k);
    else v = d - (lp(w[1], k) - lp(w[0], k));
    h[n] = v * win_[n];
  }
  return h;
}

/* ---------------- FIR: Parks-McClellan ---------------- */
function bary(xg, xs, C, bs) {
  const A = new Float64Array(xg.length);
  for (let i = 0; i < xg.length; i++) {
    let num = 0, den = 0, hit = -1;
    for (let j = 0; j < xs.length; j++) {
      const d = xg[i] - xs[j];
      if (Math.abs(d) < 1e-13) { hit = j; break; }
      const t = bs[j] / d; num += t * C[j]; den += t;
    }
    A[i] = hit >= 0 ? C[hit] : num / den;
  }
  return A;
}
function bweights(x) {
  const b = new Float64Array(x.length);
  for (let i = 0; i < x.length; i++) { let p = 1; for (let j = 0; j < x.length; j++) if (j !== i) p *= (x[i] - x[j]); b[i] = 1 / p; }
  return b;
}

/** bands: flat edge list in Hz; desired/weight per band. Odd numtaps only. */
function remez(numtaps, bands, desired, weight, fs, opts = {}) {
  const gridDensity = opts.gridDensity || 20, maxiter = opts.maxiter || 80, tol = opts.tol || 1e-9, kind = opts.kind || 'bandpass';
  if (!['bandpass', 'hilbert', 'differentiator'].includes(kind)) throw new Error(`kind must be 'bandpass', 'hilbert' or 'differentiator', not '${kind}'`);
  const odd = numtaps % 2 === 1, anti = kind !== 'bandpass';
  const edges = bands.map(b => b / (fs / 2) * PI); const nb = edges.length / 2;
  weight = weight || new Array(nb).fill(1);
  for (let b = 0; b < nb; b++) if (!odd && !anti && Math.abs(edges[2 * b + 1] - PI) < 1e-12 && desired[b] !== 0)
    throw new Error('even numtaps gives a type II filter, which has a forced zero at fs/2; a band ending at fs/2 must have desired gain 0, or use an odd numtaps');
  const Lt = Math.floor(numtaps / 2) + (odd && !anti ? 1 : 0); // terms in P
  const Qf = odd && !anti ? (() => 1) : !anti ? (w => Math.cos(w / 2)) : odd ? (w => Math.sin(w)) : (w => Math.sin(w / 2));
  const M = Lt - 1, R = M + 2;
  const delf = PI / (gridDensity * Lt); // keep the grid off the forced zeros of Qf, as scipy does
  if (anti && edges[0] < delf) edges[0] = delf;
  if (anti === odd && edges[edges.length - 1] > PI - delf) edges[edges.length - 1] = PI - delf;
  const widths = []; let wsum = 0;
  for (let b = 0; b < nb; b++) { widths.push(edges[2 * b + 1] - edges[2 * b]); wsum += widths[b]; }
  const total = gridDensity * (M + 1);
  const wl = [], Dl = [], Wl = [], starts = []; let pos = 0;
  for (let b = 0; b < nb; b++) {
    const n = Math.max(Math.round(total * widths[b] / wsum), 8);
    for (let i = 0; i < n; i++) {
      const wv = edges[2 * b] + (edges[2 * b + 1] - edges[2 * b]) * i / (n - 1), f = wv / (2 * PI), q = Qf(wv);
      const dv = kind === 'differentiator' ? desired[b] * f : desired[b], wt = kind === 'differentiator' && desired[b] >= 1e-4 ? weight[b] / f : weight[b];
      wl.push(wv); Dl.push(dv / q); Wl.push(wt * q);
    }
    starts.push([pos, pos + n]); pos += n;
  }
  const L = wl.length, w = Float64Array.from(wl), D = Float64Array.from(Dl), W = Float64Array.from(Wl);
  const xg = w.map(Math.cos);
  let ext = []; for (let i = 0; i < R; i++) ext.push(Math.round(i * (L - 1) / (R - 1)));
  ext = Array.from(new Set(ext));
  while (ext.length < R) { const r = Math.floor(Math.random() * L); if (!ext.includes(r)) ext.push(r); ext.sort((a, b) => a - b); }
  let delta = 0, it = 0;
  const solve = ex => {
    const x = Float64Array.from(ex.map(i => xg[i])), b = bweights(x);
    let n1 = 0, d1 = 0; for (let i = 0; i < R; i++) { const s = i % 2 ? -1 : 1; n1 += b[i] * D[ex[i]]; d1 += b[i] * s / W[ex[i]]; }
    const dl = n1 / d1; const C = new Float64Array(R);
    for (let i = 0; i < R; i++) C[i] = D[ex[i]] - (i % 2 ? -1 : 1) * dl / W[ex[i]];
    const xs = x.slice(0, R - 1), Cs = C.slice(0, R - 1);
    return { dl, xs, Cs, bs: bweights(xs) };
  };
  for (it = 0; it < maxiter; it++) {
    const sol = solve(ext); delta = sol.dl;
    const A = bary(xg, sol.xs, sol.Cs, sol.bs); const E = new Float64Array(L); let Q = 0;
    for (let i = 0; i < L; i++) { E[i] = W[i] * (D[i] - A[i]); Q = Math.max(Q, Math.abs(E[i])); }
    const cand = [];
    for (const [s, t] of starts) {
      const last = t - s - 1;
      for (let i = 0; i <= last; i++) {
        const e = Math.abs(E[s + i]), sg = Math.sign(E[s + i]);
        const left = i === 0 || e >= Math.abs(E[s + i - 1]) || sg !== Math.sign(E[s + i - 1]);
        const right = i === last || e >= Math.abs(E[s + i + 1]) || sg !== Math.sign(E[s + i + 1]);
        if (left && right) cand.push(s + i);
      }
    }
    const keep = [];
    for (const i of cand) {
      if (keep.length && Math.sign(E[i]) === Math.sign(E[keep[keep.length - 1]])) { if (Math.abs(E[i]) > Math.abs(E[keep[keep.length - 1]])) keep[keep.length - 1] = i; }
      else keep.push(i);
    }
    while (keep.length > R) { if (Math.abs(E[keep[0]]) < Math.abs(E[keep[keep.length - 1]])) keep.shift(); else keep.pop(); }
    if (keep.length < R) break;
    const same = keep.every((v, i) => v === ext[i]);
    ext = keep;
    if (same || (Q - Math.abs(delta)) / Q < tol) break;
  }
  const sol = solve(ext); delta = sol.dl;
  const h = new Float64Array(numtaps);
  if (odd && !anti) { // type I: closed form
    const Ak = bary(Float64Array.from({ length: M + 1 }, (_, k) => Math.cos(2 * PI * k / numtaps)), sol.xs, sol.Cs, sol.bs);
    for (let n = 0; n < numtaps; n++) {
      let s = Ak[0]; for (let k = 1; k <= M; k++) s += 2 * Ak[k] * Math.cos(2 * PI * k / numtaps * (n - M));
      h[n] = s / numtaps;
    }
  } else { // inverse DFT of the amplitude at the N DFT frequencies (Qf carries the sign past pi)
    const wk = Float64Array.from({ length: numtaps }, (_, k) => 2 * PI * k / numtaps);
    const P = bary(wk.map(Math.cos), sol.xs, sol.Cs, sol.bs), al = (numtaps - 1) / 2;
    for (let n = 0; n < numtaps; n++) {
      let s = 0; for (let k = 0; k < numtaps; k++) { const a = Qf(wk[k]) * P[k], t = wk[k] * (n - al); s += anti ? -a * Math.sin(t) : a * Math.cos(t); }
      h[n] = s / numtaps;
    }
  }
  return { h, delta: Math.abs(delta), iterations: it + 1 };
}

/* ---------------- IIR ---------------- */
function buttap(N) { const p = []; for (let m = -N + 1; m < N; m += 2) p.push(cscale(cexp(cx(0, PI * m / (2 * N))), -1)); return { z: [], p, k: 1 }; }
function cheb1ap(N, rp) {

  const st = state, q = st.q, v = $('#view'), qa = quantAnalysis(d, st), nyq = st.fs / 2, iir = d.kind === 'iir';
  const sliderBlock = (id, label, min, max, val, big) => `<div class="slider"><label for="${id}">${label}</label><span class="big num">${big}</span><input type="range" id="${id}" min="${min}" max="${max}" value="${val}"></div>`;
  const fmtS = f => f.fracBits >= 0 ? `Q${f.intBits}.${f.fracBits}` : `step ${Math.pow(2, -f.fracBits)}`;
  const deadMsg = qa.stable && !qa.alive ? `<div class="banner"><b>Passband lost.</b> At ${q.coef} bits the rounded coefficients are too coarse to pass the signal. Use more bits${iir && q.struct === 'direct' ? ' or switch to a biquad cascade' : ''}.</div>` : '';
  const unstableMsg = deadMsg || (!qa.stable ? `<div class="banner"><b>Unstable.</b> After rounding to ${q.coef} bits, ${iir ? (q.struct === 'direct' ? 'a pole of the single high-order polynomial moved to radius ' + fmtN(qa.maxR, 3) + ', outside the unit circle.' : 'a biquad pole moved outside the unit circle.') : ''} Use more bits${iir && q.struct === 'direct' ? ' or switch to a biquad cascade' : ''}.</div>` : '');
  const sweepNote = iir ? 'Gaps mean the filter went unstable or lost its passband at that word length.' : '';
  v.innerHTML = `<div class="panel card"><div class="qctl">
      ${sliderBlock('qCoef', 'Coefficient word length', 4, 24, q.coef, `${q.coef} bits <small class="unit">${fmtS(qa.fmt)}</small>`)}
      ${sliderBlock('qSig', 'Signal word length', 8, 20, q.sig, `${q.sig} bits <small class="unit">Q0.${q.sig - 1}</small>`)}
      <div><div class="field" style="grid-template-columns:1fr 130px;margin-top:0"><label for="qRound">Coefficient rounding</label><select id="qRound"><option value="nearest">Nearest</option><option value="floor">Floor (truncate)</option></select></div>
      ${iir ? `<div class="field" style="grid-template-columns:1fr 130px"><label for="qStruct">Structure</label><select id="qStruct"><option value="sos">Biquad cascade</option><option value="direct">Single direct form</option></select></div>` : ''}
      <div class="field" style="grid-template-columns:1fr 130px"><label for="qOver">On overflow</label><select id="qOver"><option value="saturate">Saturate</option><option value="wrap">Wrap around</option></select></div></div>
      ${iir ? `<div>${sliderBlock('qHead', 'Input headroom', 0, 6, q.headroom, `${q.headroom} bit${q.headroom === 1 ? '' : 's'} <small class="unit">${q.headroom ? '−' + fmtN(6.02 * q.headroom, 1) + ' dB SNR' : 'none'}</small>`)}
      <label class="check"><input type="checkbox" id="qEF"${q.ef ? ' checked' : ''}> Error feedback <small class="unit">feeds each rounding error back through round(a₁), round(a₂)</small></label></div>` : ''}</div></div>
    <div class="grid2"><div class="col">
      <div class="panel card"><div class="card-head"><h2>Response, before and after rounding</h2></div>${legend([{ label: 'Floating point', color: 'var(--s1)' }, { label: `Quantized, ${q.coef}-bit coefficients`, color: 'var(--s2)' }])}<div class="chart" id="qMag"></div>${unstableMsg}</div>
      <div class="panel card"><div class="card-head"><h2>Stopband attenuation against word length</h2></div>${legend([{ label: 'Floating point', color: 'var(--s1)', dash: true }, ...qa.sweep.map(s => ({ label: s.name, color: s.color, dash: s.dash }))])}<div class="chart" id="qSweep"></div><p class="hint">${sweepNote} Marker on the chart is your current setting.</p><div id="qSweepT"></div></div></div>
    <div class="col"><div class="panel card"><div class="card-head"><h2>Poles and zeros</h2></div>${legend([{ label: 'Floating point', color: 'var(--s1)' }, { label: 'Quantized', color: 'var(--s2)' }])}<div class="chart" id="qPZ"></div></div>
      <div class="panel card"><div class="card-head"><h2>Rounding effects</h2></div>${quantScore(d, qa)}</div></div></div>`;
  $('#qRound').value = q.round; if (iir) $('#qStruct').value = q.struct;
  const upd = () => renderQuant(current);
  $('#qCoef').oninput = e => { q.coef = +e.target.value; upd(); focusRestore('qCoef'); }; $('#qSig').oninput = e => { q.sig = +e.target.value; upd(); focusRestore('qSig'); };
  $('#qRound').onchange = e => { q.round = e.target.value; upd(); }; if (iir) $('#qStruct').onchange = e => { q.struct = e.target.value; upd(); };
  $('#qOver').value = q.overflow; $('#qOver').onchange = e => { q.overflow = e.target.value; upd(); };
  if (iir) { $('#qHead').oninput = e => { q.headroom = +e.target.value; upd(); focusRestore('qHead'); }; $('#qEF').onchange = e => { q.ef = e.target.checked; upd(); focusRestore('qEF'); }; }
  const fr = Array.from(d.resp.f), y = Array.from(qa.resp.db);
  lineChart($('#qMag'), { label: 'Magnitude before and after quantization', height: 290, xd: [0, nyq], yd: yDomain(st), yLabel: 'Gain (dB)', xLabel: 'Frequency (Hz)', shades: magShades(st, d), series: [{ x: fr, y: Array.from(d.resp.db) }, { x: fr, y }],
    tip: i => `<b>${fmtN(d.resp.f[i], 1)} Hz</b><br><span class="sw" style="background:var(--s1)"></span>${fmtN(d.resp.db[i], 2)} dB<br><span class="sw" style="background:var(--s2)"></span>${fmtN(y[i], 2)} dB` });
  const wd = qa.sweepWords, series = [{ x: wd, y: wd.map(() => qa.floatAtten), color: 'var(--s1)', dash: true }, ...qa.sweep.map(s => ({ x: wd, y: s.y, color: s.color, dash: s.dash }))];
  const all = series.flatMap(s => s.y).filter(Number.isFinite), hi = Math.max(...all, st.rs) + 6;
  lineChart($('#qSweep'), { label: 'Stopband attenuation against coefficient word length', height: 250, xd: [4, 24], yd: [0, Math.ceil(hi / 10) * 10], xticks: [4, 8, 12, 16, 20, 24], fx: v => v, fy: v => v, xLabel: 'Coefficient word length (bits)', yLabel: 'Attenuation (dB)', series, hlines: [{ y: st.rs }],
    tip: i => `<b>${wd[i]} bits</b><br>Float: ${fmtN(qa.floatAtten, 1)} dB` + qa.sweep.map(s => `<br><span class="sw" style="background:${s.color}"></span>${s.name}: ${Number.isFinite(s.y[i]) ? fmtN(s.y[i], 1) + ' dB' : 'unstable or no passband'}`).join('') });
  const cur = $('#qSweep svg'); if (cur) { /* current-setting marker */ const W = cur.viewBox.baseVal.width, m = { l: 62, r: 14 }; const xv = m.l + (q.coef - 4) / 20 * (W - m.l - m.r); cur.insertAdjacentHTML('beforeend', `<line x1="${xv}" x2="${xv}" y1="22" y2="${250 - 24}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="1 3" pointer-events="none"/>`); }
  $('#qSweepT').innerHTML = tableDetails(['Bits', ...qa.sweep.map(s => s.name)], wd.map((w, i) => [w, ...qa.sweep.map(s => Number.isFinite(s.y[i]) ? fmtN(s.y[i], 1) + ' dB' : 'unstable or no passband')]));
  pzChart($('#qPZ'), { zeros: d.zeros, poles: d.poles, poleOrigin: d.poleOrigin, qZeros: qa.zeros, qPoles: qa.poles, qPoleOrigin: qa.poleOrigin || 0, fs: st.fs });
}
function focusRestore(id) { const el = document.getElementById(id); if (el) el.focus(); }
function quantScore(d, qa) {
  const st = state, lsb = Math.pow(2, -qa.fmt.fracBits), row = (ok, lab, val, sub) => `<div class="row"><span class="ic ${ok ? 'ok' : 'no'}" aria-hidden="true">${ok ? '✓' : '✕'}</span><span class="lab">${lab}</span><span class="val num">${val}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
  const stopOk = qa.alive && qa.m.atten >= st.rs - 0.01, ripOk = qa.alive && qa.m.ripple <= st.rp * 1.0005 + 1e-6;
  let h = '<div class="score">';
  h += row(qa.stable, 'Stability', qa.stable ? 'Stable' : 'Unstable', d.kind === 'fir' ? 'FIR filters cannot go unstable.' : `Largest pole radius ${fmtN(qa.maxR, 4)}`);
  h += row(stopOk, 'Stopband attenuation', qa.alive ? fmtN(qa.m.atten, 1) + ' dB' : 'n/a', `Floating point gives ${fmtN(d.m.atten, 1)} dB. Spec ${st.rs} dB.`);
  h += row(ripOk, 'Passband ripple', qa.alive ? fmtN(qa.m.ripple, 3) + ' dB' : 'n/a', `Floating point gives ${fmtN(d.m.ripple, 3)} dB. Spec ${st.rp} dB.`);
  h += row(qa.maxErr <= lsb / 2 + 1e-15, 'Largest coefficient error', qa.maxErr.toExponential(1), `Rounding limit is half a step, ${(lsb / 2).toExponential(1)}. Format ${qa.fmt.fracBits >= 0 ? 'Q' + qa.fmt.intBits + '.' + qa.fmt.fracBits : 'coarser than 1 (step ' + Math.pow(2, -qa.fmt.fracBits) + ')'}.`);
  if (qa.sqnr !== undefined && (d.kind === 'fir' || st.q.struct === 'sos')) {
    const gap = 10 * Math.log10(qa.noise / qa.theory);
    h += row(Math.abs(gap) < 3, 'Round-off noise', fmtN(10 * Math.log10(qa.noise), 1) + ' dB', `Theory predicts ${fmtN(10 * Math.log10(qa.theory), 1)} dB (${gap >= 0 ? '+' : ''}${fmtN(gap, 1)} dB off). ${d.kind === 'iir' ? `Inside the cascade, before the output gain${st.q.headroom ? `, scaled back by 2^${st.q.headroom}` : ''}${st.q.ef ? ', with error feedback' : ''}. ` : ''}Relative to a 1.0 full scale.${Math.abs(gap) >= 3 && st.q.overflow === 'wrap' ? ' Large gaps with wrap-around usually mean the signal overflowed.' : ''}`);
    h += row(true, 'Signal-to-noise ratio', fmtN(qa.sqnr, 1) + ' dB', `Fixed-point output against the ideal floating-point filter, so coefficient rounding counts too. ${st.q.sig}-bit signal.`);
  } else if (d.kind === 'iir' && st.q.struct === 'direct') h += '<div class="banner info">Round-off noise is simulated for the biquad cascade only. Direct form is shown for its coefficient sensitivity: switch Structure to see the noise figures.</div>';
  else if (!qa.stable) h += '<div class="banner info">Noise simulation skipped because the quantized filter is unstable.</div>';
  return h + '</div>';
}

/* ================= export ================= */
function pythonSnippet(d) {
  const st = state, nyq = st.fs / 2, e = st.edges, f = v => String(Math.round(v * 1e6) / 1e6);
  const dp = (Math.pow(10, st.rp / 20) - 1) / (Math.pow(10, st.rp / 20) + 1), ds = Math.pow(10, -st.rs / 20);
  const des = { lowpass: '[1, 0]', highpass: '[0, 1]', bandpass: '[0, 1, 0]', bandstop: '[1, 0, 1]' }[st.btype];
  const w = { lowpass: [1 / dp, 1 / ds], highpass: [1 / ds, 1 / dp], bandpass: [1 / ds, 1 / dp, 1 / ds], bandstop: [1 / dp, 1 / ds, 1 / dp] }[st.btype].map(x => +x.toPrecision(5));
  if (st.method === 'remez') return `from dsp import remez\nh = remez(${d.taps}, [0, ${e.map(f).join(', ')}, ${f(nyq)}], ${des},\n          weight=[${w.join(', ')}], fs=${st.fs})`;
  if (st.method === 'window') { const cuts = st.btype === 'lowpass' || st.btype === 'highpass' ? [(e[0] + e[1]) / 2] : [(e[0] + e[1]) / 2, (e[2] + e[3]) / 2]; return `from dsp import fir_window\nh = fir_window(${d.taps}, ${cuts.length > 1 ? '[' + cuts.map(f).join(', ') + ']' : f(cuts[0])}, "${st.btype}", "${st.win}", fs=${st.fs}${st.win === 'kaiser' ? ', beta=' + fmtN(d.beta, 4) : ''})`; }
  const sp = splitEdges(st.btype, e), ed = (st.method === 'cheby2' ? sp.stop : sp.pass), edTxt = ed.length > 1 ? '[' + ed.map(f).join(', ') + ']' : f(ed[0]);
  return `from dsp import design_iir\nd = design_iir("${st.method}", "${st.btype}", ${d.order}, ${edTxt}, fs=${st.fs}, rp=${st.rp}, rs=${st.rs}${st.method === 'butter' ? ',\n               butter_edge_rp=' + st.rp : ''})\nsos = d["sos"]   # biquad cascade; d["b"], d["a"] hold the single polynomial form`;
}
function cSnippet(d, fixed) {
  const st = state, q = st.q;
  if (d.kind === 'fir') {
    if (!fixed) return `// ${d.title}, fs = ${st.fs} Hz\nstatic const float h[${d.h.length}] = {\n  ${d.h.map(v => v.toExponential(9) + 'f').join(',\n  ')}\n};`;
    const fm = D.autoFormat(Math.max(...d.h.map(Math.abs)), q.coef); const T = q.coef <= 16 ? 'int16_t' : 'int32_t';
    return `// ${d.title}, fs = ${st.fs} Hz. Q${fm.intBits}.${fm.fracBits} coefficients (value = integer / 2^${fm.fracBits})\n#define H_FRAC_BITS ${fm.fracBits}\nstatic const ${T} h[${d.h.length}] = {\n  ${d.h.map(v => D.toInt(v, fm, q.round)).join(', ')}\n};`;
  }
  if (!fixed) return `// ${d.title}, fs = ${st.fs} Hz. Each row: b0 b1 b2 a1 a2 (a0 = 1)\nstatic const float sos[${d.sos.length}][5] = {\n${d.sos.map(s => '  { ' + [0, 1, 2, 4, 5].map(i => s[i].toExponential(9) + 'f').join(', ') + ' }').join(',\n')}\n};`;
  const qs = D.quantizeSos(d.sos, q.coef, q.round), T = q.coef <= 16 ? 'int16_t' : 'int32_t';
  return `// ${d.title}, fs = ${st.fs} Hz. Q${qs.fmt.intBits}.${qs.fmt.fracBits} coefficients. Each row: b0 b1 b2 a1 a2 (a0 = 1)\n#define SOS_FRAC_BITS ${qs.fmt.fracBits}\nstatic const ${T} sos[${d.sos.length}][5] = {\n${d.sos.map(s => '  { ' + [0, 1, 2, 4, 5].map(i => D.toInt(s[i], qs.fmt, q.round)).join(', ') + ' }').join(',\n')}\n};`;
}
function copy(text) {
  const done = () => toast('Copied to clipboard');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed. Select the text manually.'); } t.remove(); }
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

/* ================= controls ================= */
const miniIcon = bt => {
  const p = { lowpass: 'M2 4H14Q18 4 20 8T26 12H32', highpass: 'M2 12H8Q14 12 16 8T22 4H32', bandpass: 'M2 12H9Q13 12 15 6T19 6T23 12H32', bandstop: 'M2 4H9Q13 4 15 10T19 10T23 4H32' }[bt];
  return `<svg viewBox="0 0 34 16" aria-hidden="true"><path d="${p}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
};
function buildControls() {
  $('#controls').innerHTML = `
  <section><h3>Method</h3><div class="method" role="radiogroup" aria-label="Design method">${Object.entries(METHODS).map(([k, m]) => `<label><input type="radio" name="method" value="${k}"><b>${m.name}</b><small>${m.note}</small></label>`).join('')}</div></section>
  <section><h3>Response type</h3><div class="seg" id="btype" role="group" aria-label="Response type">${Object.entries(BTYPES).map(([k, l]) => `<button data-v="${k}" aria-pressed="false">${miniIcon(k)}${l}</button>`).join('')}</div></section>
  <section><h3>Spec</h3>
    <div class="field"><label for="fs">Sample rate</label><span><input id="fs" type="number" min="100" step="100"></span></div>
    <div id="edgeFields"></div>
    <div class="field"><label for="rp">Passband ripple</label><span><input id="rp" type="number" min="0.01" max="6" step="any"></span></div>
    <div class="field"><label for="rs">Stopband attenuation</label><span><input id="rs" type="number" min="10" max="140" step="any"></span></div>
    <p class="hint">Frequencies in Hz, ripple and attenuation in dB.</p></section>
  <section><h3>Size</h3>
    <div class="field hidden" id="winRow"><label for="win">Window</label><select id="win">${Object.entries(WINDOWS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
    <div class="seg" id="omode" role="group" aria-label="Order selection"><button data-v="auto" aria-pressed="true">Pick for me</button><button data-v="manual" aria-pressed="false">Set it</button></div>
    <div class="field"><label for="ord" id="ordLab">Taps</label><span><input id="ord" type="number" min="1" step="1"></span></div>
    <p class="hint" id="ordHint"></p></section>`;
  $$('input[name=method]').forEach(r => r.addEventListener('change', () => { state.method = r.value; if (METHODS[r.value].kind === 'iir' && state.orderMode === 'manual') state.order = clamp(current?.order || 4, 1, 24); syncControls(); scheduleRender(); }));
  $$('#btype button').forEach(b => b.addEventListener('click', () => { state.btype = b.dataset.v; state.edges = defaultEdges(state.btype, state.fs); syncControls(); scheduleRender(); }));
  $('#fs').addEventListener('input', e => { const nf = +e.target.value; if (nf >= 100) { const r = nf / state.fs; state.edges = state.edges.map(x => Math.round(x * r)); state.fs = nf; syncControls(true); scheduleRender(); } });
  $('#rp').addEventListener('input', e => { if (+e.target.value > 0) { state.rp = +e.target.value; scheduleRender(); } });
  $('#rs').addEventListener('input', e => { if (+e.target.value > 0) { state.rs = +e.target.value; scheduleRender(); } });
  $('#win').addEventListener('change', e => { state.win = e.target.value; scheduleRender(); });
  $$('#omode button').forEach(b => b.addEventListener('click', () => { state.orderMode = b.dataset.v; if (b.dataset.v === 'manual' && current) state.order = current.kind === 'fir' ? current.taps : current.order; syncControls(); scheduleRender(); }));
  $('#ord').addEventListener('input', e => { const n = Math.round(+e.target.value); if (n >= 1) { state.order = n; scheduleRender(); } });
}
function syncControls(skipFs) {
  const st = state, M = METHODS[st.method];
  $$('input[name=method]').forEach(r => { r.checked = r.value === st.method; });
  $$('#btype button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st.btype)));
  if (!skipFs && document.activeElement !== $('#fs')) $('#fs').value = st.fs;
  if (document.activeElement !== $('#rp')) $('#rp').value = st.rp; if (document.activeElement !== $('#rs')) $('#rs').value = st.rs;
  const host = $('#edgeFields'), n = st.edges.length;
  if (host.dataset.sig !== st.btype) {
    host.dataset.sig = st.btype;
    host.innerHTML = LABELS[st.btype].map((l, i) => `<div class="field"><label for="e${i}">${l}</label><span><input id="e${i}" type="number" step="any" data-i="${i}"></span></div>`).join('');
    $$('#edgeFields input').forEach(inp => inp.addEventListener('input', () => {
      const i = +inp.dataset.i, v = +inp.value; if (!(v > 0)) return; const gap = Math.max(st.fs / 800, 1), e = st.edges.slice();
      e[i] = clamp(v, (e[i - 1] ?? 0) + gap, (e[i + 1] ?? st.fs / 2) - gap); st.edges = e; scheduleRender();
    }));
    $$('#edgeFields input').forEach(inp => inp.addEventListener('change', () => syncControls()));
  }
  $$('#edgeFields input').forEach((inp, i) => { if (document.activeElement !== inp) inp.value = Math.round(st.edges[i]); });
  $('#winRow').classList.toggle('hidden', st.method !== 'window'); $('#win').value = st.win;
  $$('#omode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st.orderMode)));
  const ord = $('#ord'); ord.disabled = st.orderMode === 'auto'; $('#ordLab').textContent = M.kind === 'fir' ? 'Taps' : (st.btype === 'bandpass' || st.btype === 'bandstop' ? 'Prototype order' : 'Order'); ord.max = M.kind === 'fir' ? 1201 : 24;
  if (document.activeElement !== ord) ord.value = st.orderMode === 'manual' ? st.order : (current ? (current.kind === 'fir' ? current.taps : current.order) : '');
  $('#ordHint').textContent = st.orderMode === 'auto' ? (st.method === 'remez' ? 'Searches for the fewest taps that meet the spec.' : st.method === 'window' ? 'From the transition width and window.' : (st.btype === 'bandpass' || st.btype === 'bandstop' ? 'Lowest order that meets the spec. Band filters end up twice the prototype order.' : 'Lowest order that meets the spec.')) : 'Manual size. The spec check shows what you get.';
}

/* ================= render loop ================= */
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
function render() {
  const st = state; let d;
  try { d = designFilter(st, fastMode); } catch (err) { $('#view').innerHTML = `<div class="banner">Could not design this filter: ${esc(err.message)}. Check that the edges increase and stay below half the sample rate.</div>`; console.error(err); return; }
  current = d;
  if (st.orderMode === 'auto' && document.activeElement !== $('#ord')) $('#ord').value = d.kind === 'fir' ? d.taps : d.order;
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === st.tab)));
  if (st.tab === 'response') renderResponse(d); else if (st.tab === 'time') renderTime(d); else renderQuant(d);
  if (st.tab === 'response') drawn = true;
  $('#subtitle').textContent = d.title;
  if (fastMode) { clearTimeout(render.t); render.t = setTimeout(() => { fastMode = false; scheduleRender(); }, 160); }
}

function init() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('#theme').textContent = dark ? 'Light theme' : 'Dark theme';
  $('#theme').addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? 'Light theme' : 'Dark theme'; render(); });
  $('#copyPy').addEventListener('click', () => current && copy(pythonSnippet(current)));
  $$('.tabs button').forEach(b => b.addEventListener('click', () => { state.tab = b.dataset.tab; render(); }));
  buildControls(); syncControls();
  let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => current && render(), 120); }).observe($('#view'));
  render(); window.__filterlab = { state, designFilter, get current() { return current; } };
}
document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
